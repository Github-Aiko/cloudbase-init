workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR\\.cache\\pip"
  PYTHONUTF8: "1"
  TEST_RESOURCES: "https://github.com/cloudbase/cloudbase-init-test-resources.git"
  TEST_RESOURCES_BRANCH: "master"
  UPPER_CONSTRAINTS: "upper-constraints.txt"

default:
  tags:
    - windows
  retry:
    max: 2
    when:
      - runner_system_failure
  hooks:
    pre_get_sources_script:
      - |
        $staleConfigDrive = Join-Path $env:CI_PROJECT_DIR `
            "test-resources\cloudbase-init-config-drive.iso"
        if (Test-Path $staleConfigDrive -PathType Leaf) {
            Write-Host "Dismounting stale functional-test config drive"
            Dismount-DiskImage -ImagePath $staleConfigDrive `
                -ErrorAction SilentlyContinue
            Remove-Item $staleConfigDrive -Force -ErrorAction Stop
        }
  cache:
    key: "pip-$CI_JOB_NAME_SLUG"
    paths:
      - .cache/pip/
      - .python-3.14/
  before_script:
    - |
      $ErrorActionPreference = "Stop"
      function Initialize-MsvcEnvironment {
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) {
              return
          }

          $vcvarsAll = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere -PathType Leaf) {
              $vcvarsAll = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -find "VC\Auxiliary\Build\vcvarsall.bat" |
                  Select-Object -First 1
          }

          if (-not $vcvarsAll) {
              $vcvarsCandidates = @(
                  "$env:ProgramFiles\Microsoft Visual Studio\18\Community\VC\Auxiliary\Build\vcvarsall.bat",
                  "$env:ProgramFiles\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvarsall.bat",
                  "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat",
                  "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat"
              )
              $vcvarsAll = $vcvarsCandidates |
                  Where-Object { Test-Path $_ -PathType Leaf } |
                  Select-Object -First 1
          }

          if (-not $vcvarsAll) {
              throw "Microsoft Visual C++ 14.0+ is required to build pymi. Install the Visual Studio 'Desktop development with C++' workload (Microsoft.VisualStudio.Workload.VCTools) on this runner."
          }

          Push-Location (Split-Path $vcvarsAll -Parent)
          try {
              $visualStudioEnvironment = & cmd.exe /d /c "vcvarsall.bat x86_amd64 && set"
              if ($LASTEXITCODE -ne 0) {
                  throw "vcvarsall.bat failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Pop-Location
          }

          foreach ($line in $visualStudioEnvironment) {
              if ($line -notmatch "^[^=][^=]*=") {
                  continue
              }
              $name, $value = $line -split "=", 2
              Set-Item -Force -Path "Env:$name" -Value $value
          }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
              throw "vcvarsall.bat completed, but cl.exe is still unavailable. Repair the Visual C++ x64/x86 build tools workload."
          }
          Write-Host "Using MSVC: $((Get-Command cl.exe).Source)"
      }

      Initialize-MsvcEnvironment

      function Test-Python314 {
          param(
              [Parameter(Mandatory = $true)]
              [string] $Executable,
              [string[]] $PrefixArguments = @()
          )

          if (-not (Test-Path $Executable -PathType Leaf)) {
              return $false
          }

          & $Executable ($PrefixArguments + @(
              "-c",
              "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 14) else 1)"
          )) 2>$null
          return $LASTEXITCODE -eq 0
      }

      $script:PythonExecutable = $null
      $script:PythonPrefixArguments = @()

      $launcher = Get-Command py.exe -ErrorAction SilentlyContinue
      if ($launcher -and (Test-Python314 $launcher.Source @("-3.14"))) {
          $script:PythonExecutable = $launcher.Source
          $script:PythonPrefixArguments = @("-3.14")
      }

      if (-not $script:PythonExecutable) {
          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($python -and (Test-Python314 $python.Source)) {
              $script:PythonExecutable = $python.Source
          }
      }

      if (-not $script:PythonExecutable) {
          $knownPythonPaths = @(
              "C:\Python314\python.exe",
              "$env:ProgramFiles\Python314\python.exe",
              "$env:ProgramFiles\Python\Python314\python.exe",
              "$env:LOCALAPPDATA\Programs\Python\Python314\python.exe",
              "$env:CI_PROJECT_DIR\.python-3.14\python.exe"
          )
          foreach ($pythonPath in $knownPythonPaths) {
              if (Test-Python314 $pythonPath) {
                  $script:PythonExecutable = $pythonPath
                  break
              }
          }
      }

      if (-not $script:PythonExecutable) {
          $pythonManager = "C:\Program Files\PyManager\pymanager.exe"
          $pythonTarget = "$env:CI_PROJECT_DIR\.python-3.14"
          if (-not (Test-Path $pythonManager -PathType Leaf)) {
              $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
              if (-not $choco) {
                  throw "Python 3.14 and Chocolatey are unavailable. Install Chocolatey or Python 3.14 on this runner."
              }

              Write-Host "Python 3.14 not found; installing python314 with Chocolatey"
              & $choco.Source install python314 -y --no-progress `
                  --params "/InstallDir:C:\Python314"
              $chocoExitCode = $LASTEXITCODE
              if ($chocoExitCode -notin @(0, 1605, 1614, 1641, 3010)) {
                  throw "Chocolatey failed to install python314 (exit code $chocoExitCode)."
              }

              $machinePath = [Environment]::GetEnvironmentVariable(
                  "Path", "Machine")
              $env:PATH = "$machinePath;$env:PATH"
              $chocoPython = "C:\Python314\python.exe"
              if (-not (Test-Python314 $chocoPython)) {
                  $chocoPythonCommand = Get-Command python.exe `
                      -ErrorAction SilentlyContinue
                  if ($chocoPythonCommand -and
                      (Test-Python314 $chocoPythonCommand.Source)) {
                      $chocoPython = $chocoPythonCommand.Source
                  }
                  else {
                      throw "Chocolatey completed, but Python 3.14 could not be discovered."
                  }
              }
              $script:PythonExecutable = $chocoPython
          }
          else {
              & $pythonManager install --target=$pythonTarget --force --update 3.14
              if ($LASTEXITCODE -ne 0) {
                  throw "Python Install Manager failed with exit code $LASTEXITCODE."
              }
              $script:PythonExecutable = "$pythonTarget\python.exe"
          }
      }

      function Invoke-Python {
          $pythonArguments = @($script:PythonPrefixArguments) + @($args)
          & $script:PythonExecutable $pythonArguments
          if ($LASTEXITCODE -ne 0) {
              throw "Python command failed with exit code $LASTEXITCODE."
          }
      }
      Invoke-Python --version
      $pythonScripts = & $script:PythonExecutable `
          (@($script:PythonPrefixArguments) + @("-c", "import sysconfig; print(sysconfig.get_path('scripts'))"))
      if ($LASTEXITCODE -ne 0 -or -not $pythonScripts) {
          throw "Unable to discover the Python scripts directory."
      }
      $env:PATH = "$($pythonScripts | Select-Object -Last 1);$env:PATH"

windows-unit-tests:
  stage: test
  script:
    - Invoke-Python -m pip install --upgrade pip setuptools tox
    - Invoke-Python -m tox -e "py314,pep8"

windows-functional-tests:
  stage: test
  parallel:
    matrix:
      - CLOUD_PROFILE:
          - empty
          - nocloud
          - vmwareguest
          - oracle
  script:
    - git clone --depth 1 --branch $env:TEST_RESOURCES_BRANCH $env:TEST_RESOURCES test-resources
    - |
      if ($env:CLOUD_PROFILE -eq "vmwareguest") {
          # The upstream helper assumes pip.exe and pyinstaller.exe are on
          # PATH. Use the exact Python 3.14 selected by this job instead.
          $functionalTestsFile = "test-resources/functional-tests/CloudbaseInit.Tests.ps1"
          $functionalTests = Get-Content $functionalTestsFile -Raw
          $pipCommand = "& pip.exe install pyinstaller"
          $pyInstallerCommand = '& pyinstaller -F "${rpcToolPyPath}"'
          if (-not $functionalTests.Contains($pipCommand) -or
              -not $functionalTests.Contains($pyInstallerCommand)) {
              throw "The upstream VMware preparation helper has changed unexpectedly."
          }
          $functionalTests = $functionalTests.Replace(
              $pipCommand,
              "Invoke-Python -m pip install pyinstaller").Replace(
              $pyInstallerCommand,
              'Invoke-Python -m PyInstaller -F "${rpcToolPyPath}"')
          Set-Content $functionalTestsFile -Value $functionalTests -NoNewline
      }

      # GitHub-hosted runners are ephemeral, while our Windows Shell runners
      # intentionally retain the functional fixture's users, groups and
      # files. Keep the destructive cleanup out of CI: if fixture state is
      # already present, skip only the two upstream "clean environment"
      # preconditions. The plugin execution, registry state and all post-run
      # assertions remain mandatory below.
      if ($env:CLOUD_PROFILE -in @("nocloud", "vmwareguest")) {
          $dirtyPreconditions = @()

          & net.exe user "Admin" *> $null
          if ($LASTEXITCODE -eq 0) {
              $dirtyPreconditions += "CreateUserPlugin has a clean environment"
          }

          $userDataStatePresent = $false
          & net.exe localgroup "windows" *> $null
          $userDataStatePresent = ($userDataStatePresent -or
              ($LASTEXITCODE -eq 0))
          & net.exe localgroup "cloud-users" *> $null
          $userDataStatePresent = ($userDataStatePresent -or
              ($LASTEXITCODE -eq 0))
          & net.exe user "cloud-config-user" *> $null
          $userDataStatePresent = ($userDataStatePresent -or
              ($LASTEXITCODE -eq 0))
          if ((Test-Path "C:\test_file" -PathType Leaf) -or
              (Test-Path "C:\test_append.ps1" -PathType Leaf) -or
              (Test-Path "C:\runcmd")) {
              $userDataStatePresent = $true
          }
          if ($userDataStatePresent) {
              $dirtyPreconditions += "UserDataPlugin has a clean environment"
          }

          if ($dirtyPreconditions) {
              $functionalTestsFile = "test-resources/functional-tests/CloudbaseInit.Tests.ps1"
              $functionalTests = Get-Content $functionalTestsFile -Raw
              foreach ($testName in $dirtyPreconditions) {
                  $pattern = '(?ms)^    It "' +
                      [regex]::Escape($testName) +
                      '" \{\r?\n.*?^    \}\r?\n(?=^\})'
                  $regex = [regex]::new($pattern)
                  if (-not $regex.IsMatch($functionalTests)) {
                      throw "The upstream precondition '$testName' has changed unexpectedly."
                  }
                  $replacement = (
                      '    It "' + $testName + '" {' + "`r`n" +
                      '        Set-ItResult -Skipped -Because "The self-hosted runner retains functional fixture state"' + "`r`n" +
                      '    }' + "`r`n"
                  )
                  $functionalTests = $regex.Replace(
                      $functionalTests, $replacement, 1)
              }
              Set-Content $functionalTestsFile -Value $functionalTests -NoNewline
          }

          # The upstream cloud-config uses a plain mkdir command, which exits
          # with code 1 after the first run on a persistent runner. Make only
          # this fixture command idempotent; do not delete retained data.
          if ($env:CLOUD_PROFILE -eq "nocloud") {
              $userDataFile = "test-resources/nocloud/cloudbase-init-metadata/user-data"
              $mkdirCommand = "    - 'mkdir c:\runcmd'"
              $idempotentMkdirCommand = "    - 'if not exist c:\runcmd mkdir c:\runcmd'"
          }
          else {
              $userDataFile = "test-resources/vmwareguest/mock-rpctool.py"
              $mkdirCommand = "    - 'mkdir c:\\runcmd'"
              $idempotentMkdirCommand = "    - 'if not exist c:\\runcmd mkdir c:\\runcmd'"
          }
          $userData = Get-Content $userDataFile -Raw
          if (-not $userData.Contains($mkdirCommand)) {
              throw "The upstream $($env:CLOUD_PROFILE) runcmd fixture has changed unexpectedly."
          }
          $userData = $userData.Replace(
              $mkdirCommand, $idempotentMkdirCommand)
          Set-Content $userDataFile -Value $userData -NoNewline
      }

      # The upstream NoCloud fixture intentionally contains no password or
      # WinRM certificate metadata. Do not run the certificate-auth plugin in
      # that fixture: it requires a password and would otherwise produce an
      # unrelated error before the NoCloud network assertions are evaluated.
      if ($env:CLOUD_PROFILE -eq "nocloud") {
          $configFile = "test-resources/nocloud/cloudbase-init.conf"
          $listenerPlugin = "cloudbaseinit.plugins.windows.winrmlistener.ConfigWinRMListenerPlugin"
          $certificateAuthPlugin = "cloudbaseinit.plugins.windows.winrmcertificateauth.ConfigWinRMCertificateAuthPlugin"
          $setPasswordPlugin = "cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin"
          $pluginSequence = "$listenerPlugin,$certificateAuthPlugin"
          $config = Get-Content $configFile -Raw
          if (-not $config.Contains($pluginSequence)) {
              throw "The NoCloud fixture plugin list has changed unexpectedly."
          }
          $config = $config.Replace(
              $pluginSequence,
              $listenerPlugin)
          $config = $config.Replace(",${setPasswordPlugin}", "")
          Set-Content $configFile -Value $config -NoNewline

          # Exercise the Proxmox path end-to-end. Proxmox embeds Debian
          # interfaces syntax in meta-data instead of providing NoCloud's
          # separate network-config file.
          $networkInterfaces = @(
              "auto eth0",
              "iface eth0 inet static",
              "    hwaddress ether REPLACE_MAC_ADDRESS",
              "    address 10.196.59.2",
              "    netmask 255.255.255.0",
              "    gateway 10.196.59.1",
              "    dns-nameservers 1.1.1.1 2606:4700:4700::1111",
              "iface eth0 inet6 static",
              "    address 2001:db8::10",
              "    netmask 64",
              "    gateway 2001:db8::1"
          ) -join "`n"
          $metadataFile = "test-resources/nocloud/cloudbase-init-metadata/meta-data"
          $metadata = Get-Content $metadataFile -Raw | ConvertFrom-Json
          $metadata | Add-Member -NotePropertyName "network-interfaces" `
              -NotePropertyValue $networkInterfaces -Force
          $metadata | ConvertTo-Json -Depth 20 -Compress |
              Set-Content $metadataFile -Encoding Ascii -NoNewline
          $metadataFixturePath = (Resolve-Path -LiteralPath $metadataFile).Path.Replace("'", "''")

          # Reuse the upstream helper that substitutes the TAP adapter MAC and
          # builds the CIDATA ISO, but point it at the Proxmox meta-data file.
          $functionalTestsFile = "test-resources/functional-tests/CloudbaseInit.Tests.ps1"
          $functionalTests = Get-Content $functionalTestsFile -Raw
          $networkTemplate = '"cloudbase-init-metadata\network-config.template"'
          $networkOutput = '"cloudbase-init-metadata\network-config"'
          $metadataTarget = '"cloudbase-init-metadata\meta-data"'
          if (-not $functionalTests.Contains($networkTemplate) -or
              -not $functionalTests.Contains($networkOutput)) {
              throw "The upstream NoCloud preparation helper has changed unexpectedly."
          }
          $functionalTests = $functionalTests.Replace(
              $networkTemplate, $metadataTarget).Replace(
              $networkOutput, $metadataTarget)

          # Debian interfaces metadata identifies the target NIC by MAC but
          # does not carry the schema-v2 display name. Replace the upstream
          # name-based assertion with an end-to-end MAC and dual-stack check.
          $networkAfterPattern = '(?ms)^function after\.cloudbaseinit\.plugins\.common\.networkconfig\.NetworkConfigPlugin \{\r?\n.*?^\}\r?\n'
          $networkAfterRegex = [regex]::new($networkAfterPattern)
          if (-not $networkAfterRegex.IsMatch($functionalTests)) {
              throw "The upstream network postcondition has changed unexpectedly."
          }
          $networkAfterReplacement = @(
              'function after.cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin {'
              '    It "the Proxmox adapter should have both static address families" {'
              "        `$metadataPath = '$metadataFixturePath'"
              '        $metadata = Get-Content -Raw -Path $metadataPath | ConvertFrom-Json'
              '        $macMatch = [regex]::Match($metadata."network-interfaces", "(?im)^\s*hwaddress\s+ether\s+(\S+)")'
              '        if (-not $macMatch.Success) { throw "No Proxmox hwaddress was found in meta-data" }'
              '        $expectedMac = $macMatch.Groups[1].Value.Replace(":", "").Replace("-", "").ToUpperInvariant()'
              '        $adapter = Get-NetAdapter | Where-Object {'
              '            $_.MacAddress.Replace(":", "").Replace("-", "").ToUpperInvariant() -eq $expectedMac'
              '        } | Select-Object -First 1'
              '        if (-not $adapter) { throw "The Proxmox target adapter was not found by MAC" }'
              '        $configuredAddresses = @(Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -ErrorAction Stop | Select-Object -ExpandProperty IPAddress)'
              '        foreach ($expectedAddress in @("10.196.59.2", "2001:db8::10")) {'
              '            if ($expectedAddress -notin $configuredAddresses) {'
              '                throw "Missing Proxmox address $expectedAddress on adapter $($adapter.Name)"'
              '            }'
              '        }'
              '    }'
              '}'
              ''
          ) -join "`r`n"
          $functionalTests = $networkAfterRegex.Replace(
              $functionalTests, $networkAfterReplacement, 1)
          Set-Content $functionalTestsFile -Value $functionalTests -NoNewline
      }
    - Invoke-Python -W ignore -m pip install --upgrade pip
    - Invoke-Python -W ignore -m pip install -c $env:UPPER_CONSTRAINTS --upgrade --force-reinstall -r requirements.txt
    - Invoke-Python -W ignore -m pip install .
    - |
      $pester = Get-Module -ListAvailable -Name Pester |
          Where-Object { $_.Version -ge [version]"5.0.0" } |
          Sort-Object Version -Descending |
          Select-Object -First 1
      if (-not $pester) {
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope AllUsers `
              -Force -AllowClobber -Confirm:$false
      }
      Import-Module Pester -MinimumVersion 5.0.0 -Force
      Write-Host "Using Pester $((Get-Module Pester).Version)"
      $env:CLOUD = $env:CLOUD_PROFILE
      $env:TEST_ARCHITECTURE = "x64"

      # Self-hosted Shell runners retain Cloudbase-Init's registry state.
      # Reset only this fixture instance so every profile executes its plugins
      # instead of inheriting PLUGIN_EXECUTION_DONE from an earlier job.
      $testInstanceState = "HKLM:\SOFTWARE\Cloudbase Solutions\Cloudbase-Init\b9517879-4e93-4a1a-9073-4ae0ddfac27c"
      if (Test-Path $testInstanceState) {
          Remove-Item $testInstanceState -Recurse -Force
      }
      if ($env:CLOUD_PROFILE -eq "oracle") {
          Remove-Item "C:\oracle-imdsv2-functional-test.txt" -Force `
              -ErrorAction SilentlyContinue
      }

      $beforePesterResult = Invoke-Pester test-resources/functional-tests `
          -Output Detailed -FullNameFilter TestVerifyBeforeAllPlugins `
          -PassThru
      if ($beforePesterResult.Result -ne "Passed") {
          throw "Pester pre-execution assertions failed: $($beforePesterResult.Result)"
      }

      $configFile = "./test-resources/$($env:CLOUD_PROFILE)/cloudbase-init.conf"
      & cloudbase-init.exe --noreset_service_password --config-file $configFile 2>&1 |
          Tee-Object -FilePath cloudbase-init.log

      $errors = Get-Content ./cloudbase-init.log | Where-Object { $_ -match "(?i)error" }
      $pluginExecution = Get-Content ./cloudbase-init.log | Where-Object { $_ -like "*Plugins execution done*" }
      if ($errors -or -not $pluginExecution) {
          throw "Cloudbase-Init functional execution did not complete cleanly."
      }

      $pesterResult = Invoke-Pester test-resources/functional-tests `
          -Output Detailed -FullNameFilter TestVerifyAfterAllPlugins `
          -PassThru
      if ($pesterResult.Result -ne "Passed") {
          throw "Pester functional assertions failed: $($pesterResult.Result)"
      }

      if ($env:CLOUD_PROFILE -eq "nocloud") {
          $expectedAddresses = @("10.196.59.2", "2001:db8::10")
          $metadata = Get-Content `
              "test-resources/nocloud/cloudbase-init-metadata/meta-data" `
              -Raw | ConvertFrom-Json
          $macMatch = [regex]::Match(
              $metadata."network-interfaces",
              "(?im)^\s*hwaddress\s+ether\s+(\S+)")
          if (-not $macMatch.Success) {
              throw "No Proxmox hwaddress was found in meta-data."
          }
          $expectedMac = $macMatch.Groups[1].Value.Replace(":", "").Replace("-", "").ToUpperInvariant()
          $adapter = Get-NetAdapter | Where-Object {
              $_.MacAddress.Replace(":", "").Replace("-", "").ToUpperInvariant() -eq $expectedMac
          } | Select-Object -First 1
          if (-not $adapter) {
              throw "The Proxmox target adapter was not found by MAC."
          }
          $configuredAddresses = Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex -ErrorAction Stop |
              Select-Object -ExpandProperty IPAddress
          $missingAddresses = $expectedAddresses |
              Where-Object { $_ -notin $configuredAddresses }
          if ($missingAddresses) {
              throw "Proxmox dual-stack configuration is missing: $($missingAddresses -join ', ')"
          }
          Write-Host "Verified Proxmox dual-stack addresses on $($adapter.Name): $($expectedAddresses -join ', ')"
      }
  after_script:
    - |
      $configDrive = Join-Path $env:CI_PROJECT_DIR `
          "test-resources\cloudbase-init-config-drive.iso"
      if (Test-Path $configDrive -PathType Leaf) {
          Dismount-DiskImage -ImagePath $configDrive `
              -ErrorAction SilentlyContinue
          Remove-Item $configDrive -Force -ErrorAction SilentlyContinue
      }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - cloudbase-init.log

windows-dependency-audit:
  stage: test
  script:
    - Invoke-Python -m pip install --upgrade pip pip-audit
    - Invoke-Python -m pip install -c $env:UPPER_CONSTRAINTS -r requirements.txt
    - Invoke-Python -m pip_audit
